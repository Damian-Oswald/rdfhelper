[package]
name = 'rdfhelper'
publish = false
version = '1.0.0'
edition = '2021'
rust-version = '1.65'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rdfhelper'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9.0'
oxigraph = '0.4.0'

[profile.release]
lto = true
codegen-units = 1
